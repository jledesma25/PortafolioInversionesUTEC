<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" fill="none">
  <defs>
    <!-- Gradients for 3D bars -->
    <linearGradient id="b1top" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7fffc4"/><stop offset="100%" stop-color="#2ecc8a"/></linearGradient>
    <linearGradient id="b1side" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a9960"/><stop offset="100%" stop-color="#0f6040"/></linearGradient>
    <linearGradient id="b2top" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a8f0d0"/><stop offset="100%" stop-color="#38c48a"/></linearGradient>
    <linearGradient id="b3top" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffcf90"/><stop offset="100%" stop-color="#e08030"/></linearGradient>
    <linearGradient id="b3side" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b06020"/><stop offset="100%" stop-color="#804010"/></linearGradient>
    <linearGradient id="b4top" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a0d4ff"/><stop offset="100%" stop-color="#3888d0"/></linearGradient>
    <linearGradient id="b4side" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2060a0"/><stop offset="100%" stop-color="#104080"/></linearGradient>
    <!-- Platform gradient -->
    <radialGradient id="platform" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3a9e70" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a3020" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5dffa0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5dffa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPie" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5dffa0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5dffa0" stop-opacity="0"/>
    </radialGradient>
    <!-- Donut segments -->
    <linearGradient id="dg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5dffa0"/><stop offset="100%" stop-color="#1ecc70"/></linearGradient>
    <linearGradient id="dg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffcf90"/><stop offset="100%" stop-color="#e08030"/></linearGradient>
    <linearGradient id="dg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a0d4ff"/><stop offset="100%" stop-color="#3888d0"/></linearGradient>
    <linearGradient id="dg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd0f0"/><stop offset="100%" stop-color="#c060a0"/></linearGradient>
    <filter id="gf" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sf" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="sf2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <ellipse cx="230" cy="140" rx="120" ry="70" fill="url(#glow1)" opacity="0.6"/>

  <!-- ── PLATFORM (ellipse base) ── -->
  <ellipse cx="220" cy="185" rx="105" ry="22" fill="url(#platform)"/>
  <!-- platform rim -->
  <ellipse cx="220" cy="185" rx="105" ry="22" fill="none" stroke="rgba(93,255,160,0.25)" stroke-width="1"/>

  <!-- ── 3D BARS (isometric style) ── -->
  <!-- Bar 4 (back-left, tallest) — Blue -->
  <g filter="url(#sf2)">
    <!-- front face -->
    <rect x="130" y="98" width="22" height="82" rx="2" fill="url(#b4top)"/>
    <!-- top face (parallelogram sim) -->
    <polygon points="130,98 152,98 158,92 136,92" fill="#a8d8ff" opacity="0.9"/>
    <!-- right face -->
    <polygon points="152,98 158,92 158,174 152,180" fill="url(#b4side)"/>
    <!-- bottom connector -->
    <ellipse cx="144" cy="180" rx="11" ry="4" fill="rgba(0,0,0,0.2)"/>
  </g>

  <!-- Bar 2 (second from left) — Green, tallest -->
  <g filter="url(#sf2)">
    <rect x="156" y="80" width="22" height="100" rx="2" fill="url(#b1top)"/>
    <polygon points="156,80 178,80 184,74 162,74" fill="#b0ffd8" opacity="0.9"/>
    <polygon points="178,80 184,74 184,180 178,180" fill="url(#b1side)"/>
    <ellipse cx="170" cy="180" rx="11" ry="4" fill="rgba(0,0,0,0.2)"/>
  </g>

  <!-- Bar 3 (middle) — Green, medium -->
  <g filter="url(#sf2)">
    <rect x="182" y="112" width="22" height="68" rx="2" fill="url(#b2top)"/>
    <polygon points="182,112 204,112 210,106 188,106" fill="#c8ffe8" opacity="0.9"/>
    <polygon points="204,112 210,106 210,180 204,180" fill="#18885a"/>
    <ellipse cx="196" cy="180" rx="11" ry="4" fill="rgba(0,0,0,0.2)"/>
  </g>

  <!-- Bar 4 (right) — Orange -->
  <g filter="url(#sf2)">
    <rect x="208" y="130" width="22" height="50" rx="2" fill="url(#b3top)"/>
    <polygon points="208,130 230,130 236,124 214,124" fill="#ffddb0" opacity="0.9"/>
    <polygon points="230,130 236,124 236,180 230,180" fill="url(#b3side)"/>
    <ellipse cx="222" cy="180" rx="11" ry="4" fill="rgba(0,0,0,0.2)"/>
  </g>

  <!-- ── 3D DONUT (floating top-right) ── -->
  <g filter="url(#sf)" transform="translate(248, 50)">
    <!-- glow -->
    <circle cx="42" cy="42" r="45" fill="url(#glowPie)" opacity="0.8"/>

    <!-- Donut bottom-depth (3D thickness) — shadow layer -->
    <g transform="translate(0,8)" opacity="0.5">
      <!-- Green segment bottom -->
      <path d="M42 42 L42 4 A38 38 0 1 1 11 62 Z" fill="#136b40"/>
      <!-- Orange segment bottom -->
      <path d="M42 42 L11 62 A38 38 0 0 1 42 4 Z" fill="#7a4010" opacity="0.6"/>
      <!-- hole -->
      <circle cx="42" cy="42" r="16" fill="#0e2a1a"/>
    </g>

    <!-- Top face segments -->
    <!-- Green ~65% -->
    <path d="M42 42 L42 4 A38 38 0 1 1 11 62 Z" fill="url(#dg1)"/>
    <!-- Orange ~22% -->
    <path d="M42 42 L11 62 A38 38 0 0 1 72 68 Z" fill="url(#dg2)"/>
    <!-- Blue ~10% -->
    <path d="M42 42 L72 68 A38 38 0 0 1 61 15 Z" fill="url(#dg3)"/>
    <!-- Pink ~3% -->
    <path d="M42 42 L61 15 A38 38 0 0 1 42 4 Z" fill="url(#dg4)"/>

    <!-- Hole (top) -->
    <circle cx="42" cy="42" r="16" fill="#0e2a1a"/>
    <!-- Hole shine -->
    <circle cx="38" cy="38" r="6" fill="rgba(255,255,255,0.06)"/>

    <!-- Center text -->
    <text x="42" y="39" font-family="Inter,sans-serif" font-size="8" font-weight="700" fill="#5dffa0" text-anchor="middle">5</text>
    <text x="42" y="49" font-family="Inter,sans-serif" font-size="6" fill="rgba(200,240,220,0.7)" text-anchor="middle">clases</text>
  </g>

  <!-- ── Trend line overlay ── -->
  <polyline points="118,168 134,155 150,158 166,142 182,145 198,132 214,128 230,118 246,110"
    stroke="#5dffa0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#gf)" opacity="0.7"/>
  <!-- end dot -->
  <circle cx="246" cy="110" r="4" fill="#5dffa0" filter="url(#gf)"/>
  <circle cx="246" cy="110" r="2" fill="#fff"/>

  <!-- ── Floating stat badges ── -->
  <g filter="url(#sf2)" transform="translate(118, 50)">
    <rect x="0" y="0" width="60" height="28" rx="8" fill="rgba(20,60,40,0.92)" stroke="rgba(93,255,160,0.3)" stroke-width="1"/>
    <text x="8" y="12" font-family="Inter,sans-serif" font-size="7" fill="rgba(200,240,220,0.7)">Sharpe</text>
    <text x="8" y="22" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#5dffa0">1.57 ▲</text>
  </g>

  <g filter="url(#sf2)" transform="translate(240, 160)">
    <rect x="0" y="0" width="68" height="28" rx="8" fill="rgba(20,60,40,0.92)" stroke="rgba(255,207,144,0.35)" stroke-width="1"/>
    <text x="8" y="12" font-family="Inter,sans-serif" font-size="7" fill="rgba(200,240,220,0.7)">Retorno</text>
    <text x="8" y="22" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#ffc870">+26.19%</text>
  </g>
</svg>
